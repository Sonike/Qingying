name: 发布清映 Android 软件包
run-name: 发布清映 ${{ inputs.version }} 到 Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 已在 Releases 发布的清映版本号
        required: true
        default: 2.2.1-qy.12
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: qingying-maven-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY: https://maven.pkg.github.com/sonike/Qingying
    steps:
      - name: 获取并校验已签名的 APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-qy\.[0-9]+$ ]]
          asset="Qingying-$VERSION-arm64.apk"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" |
            jq -er --arg asset "$asset" 'select(.draft == false) | .assets[] |
              select(.name == $asset and .state == "uploaded") | .digest |
              select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' > expected.sha256
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --output release.apk
          echo "$(cat expected.sha256)  release.apk" | sha256sum -c -

      - name: 发布 Maven 软件包并回读安装包
        shell: bash
        run: |
          set -euo pipefail
          base="$REGISTRY/io/github/sonike/qingying-android/$VERSION/qingying-android-$VERSION"
          fetch() {
            curl --silent --show-error --location --retry 2 --user "$GITHUB_ACTOR:$GH_TOKEN" "$@"
          }
          status=$(fetch --output published.apk --write-out '%{http_code}' "$base.apk")
          case "$status" in
            200) echo "$(cat expected.sha256)  published.apk" | sha256sum -c - ;;
            404)
              cat > settings.xml <<'XML'
          <settings>
            <servers><server>
              <id>github</id>
              <username>${env.GITHUB_ACTOR}</username>
              <password>${env.GH_TOKEN}</password>
            </server></servers>
          </settings>
          XML
              cat > artifact.pom <<XML
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>io.github.sonike</groupId>
            <artifactId>qingying-android</artifactId>
            <version>$VERSION</version>
            <packaging>apk</packaging>
            <name>清映 Android (ARM64)</name>
            <description>已签名的清映 Android ARM64 安装包</description>
            <url>https://github.com/Sonike/Qingying</url>
            <licenses><license><name>GNU General Public License v3.0</name>
              <url>https://www.gnu.org/licenses/gpl-3.0.html</url></license></licenses>
            <distributionManagement><repository><id>github</id>
              <url>$REGISTRY</url></repository></distributionManagement>
          </project>
          XML
              mvn --batch-mode --no-transfer-progress --settings settings.xml \
                org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
                -DrepositoryId=github -Durl="$REGISTRY" -DpomFile=artifact.pom \
                -Dfile=release.apk -Dextension=apk
              fetch --fail --output published.apk "$base.apk"
              echo "$(cat expected.sha256)  published.apk" | sha256sum -c -
              ;;
            *) echo "软件包查询返回 HTTP $status" >&2; exit 1 ;;
          esac
          fetch --fail --output published.pom "$base.pom"
          echo "已核对 io.github.sonike:qingying-android:$VERSION 的 APK 和 POM。" >> "$GITHUB_STEP_SUMMARY"
